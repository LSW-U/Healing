<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>P33 年度潮汐报告 · 共时海</title>
<link rel="stylesheet" href="common.css">
<style>
.p-report{height:100%;display:flex;flex-direction:column;overflow:hidden}
.rp-scroll{flex:1;overflow-y:auto;padding:0 22px}
.rp-top{padding:14px 0 6px;color:var(--smoke);font-size:13px}
.rp-top a{color:var(--smoke);text-decoration:none}
.rp-hero{text-align:center;padding:24px 0 16px}
.rp-hero .y{font-family:var(--serif);font-size:30px;letter-spacing:6px;color:var(--ink)}
.rp-hero .t{font-family:var(--serif);font-size:12px;color:var(--smoke);margin-top:8px;letter-spacing:2px}
.rp-stat{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.rp-stat .item{background:#fff;border-radius:14px;border:1px solid var(--mist);padding:18px 14px;text-align:center}
.rp-stat .item .num{font-family:var(--serif);font-size:28px;color:var(--tidal-deep);font-weight:500}
.rp-stat .item .lab{font-size:10px;color:var(--smoke);margin-top:6px;letter-spacing:1px;font-family:var(--serif)}
.rp-tide{background:#fff;border-radius:14px;border:1px solid var(--mist);padding:16px;margin:14px 0}
.rp-tide .tt{font-family:var(--serif);font-size:12px;color:var(--smoke);letter-spacing:2px;margin-bottom:12px;text-align:center}
.rp-quote{text-align:center;margin:24px 0;font-family:var(--serif);font-size:15px;color:var(--ink);line-height:2.2;letter-spacing:2px}
.rp-share{margin:10px 0 28px}
.rp-btn{display:block;width:100%;background:var(--tidal);color:#fff;border:none;padding:14px;border-radius:24px;font-size:13px;letter-spacing:2px;cursor:pointer;font-family:var(--sans);text-align:center;text-decoration:none}
</style>
</head>
<body>
<div class="phone"><div class="screen">

          <line x1="4" y1="64" x2="276" y2="64" stroke="#DDD8CF" stroke-width="0.5"/>

    </div>
  </div>
</div></div>

</html>
