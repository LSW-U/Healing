<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>P01 启动问候页 · 共时海</title>
<link rel="stylesheet" href="common.css">
<style>
.greet{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#EFE9DF 0%,#D9E2E4 60%,#C4CFD2 100%);text-align:center;padding:0 40px}
.greet .jq{font-family:var(--serif);font-size:13px;letter-spacing:6px;color:var(--tidal-deep);margin-bottom:8px}
.greet .jq b{font-weight:500;color:var(--ink-green)}
.greet .verse{font-family:var(--serif);font-size:26px;line-height:1.9;color:#3a3a3a;margin:30px 0 12px;letter-spacing:3px}
.greet .verse-sub{font-family:var(--serif);font-size:12px;color:#6b6b6b;letter-spacing:4px}
.greet .enter-btn{margin-top:60px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);color:var(--tidal-deep);font-size:14px;letter-spacing:4px;padding:13px 38px;border-radius:32px;font-family:var(--serif);cursor:pointer;transition:transform .15s}
.greet .enter-btn:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="phone"><div class="screen">
  <div class="greet">
    <div class="jq">立 秋 · <b>凉 风 至</b></div>
    <div class="verse">潮起潮落<br>你都在</div>
    <div class="verse-sub">共 时 海 · 第 廿 二 节 气</div>
    <a href="p02-discover.html"><button class="enter-btn">进 入 共 时 海</button></a>
  </div>
</div></div>
</body>
</html>
