<link rel="stylesheet" href="common.css">
<style>
.p-calendar{padding:0 16px 62px;height:100%;display:flex;flex-direction:column;overflow:hidden}
.cal-nav{position:relative;display:flex;justify-content:space-between;align-items:center;padding:8px 2px 10px}
.cal-nav .back{color:var(--smoke);font-size:14px;cursor:pointer}
.cal-nav .title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--serif);font-size:14px;letter-spacing:2px;color:var(--ink)}
.cal-nav .toggle{font-size:10px;color:var(--tidal);border:1px solid var(--mist-deep);padding:3px 11px;border-radius:12px;letter-spacing:1px;cursor:pointer}
.cal-month{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 12px}
.cal-month .m{font-family:var(--serif);font-size:18px;font-weight:500;letter-spacing:3px;color:var(--ink)}
.cal-month .m b{color:var(--wood);font-size:10px;font-weight:400;margin-left:8px;letter-spacing:2px}
.cal-month .arr{color:var(--smoke);font-size:14px;cursor:pointer}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:9px;color:var(--smoke);padding-bottom:6px;border-bottom:1px solid var(--mist);letter-spacing:1px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px 0;padding-top:5px}
.cal-cell{height:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--ink);border-radius:8px;position:relative;gap:1px;line-height:1;cursor:pointer}
.cal-cell.empty{color:transparent;cursor:default}
.cal-cell .cdot{width:4px;height:4px;border-radius:50%;background:var(--tidal)}
.cal-cell .jq{font-size:7px;color:var(--wood);letter-spacing:0;line-height:1}
.cal-cell.today{background:var(--tidal);color:#fff}
.cal-cell.today .cdot{background:#fff}
.cal-cell.today .jq{color:rgba(255,255,255,.85)}
.cal-cell.sel{box-shadow:inset 0 0 0 1.5px var(--tidal)}
.cal-event{background:#fff;border-radius:14px;padding:13px 16px;margin-top:10px;border:1px solid var(--mist)}
.cal-event .ed{font-size:10px;color:var(--smoke);letter-spacing:1px;font-family:var(--serif)}
.cal-event .en{font-family:var(--serif);font-size:15px;font-weight:500;margin:5px 0 9px;letter-spacing:1px;color:var(--ink)}
.cal-event .em{font-size:10px;color:var(--smoke);display:flex;gap:8px;align-items:center;margin-bottom:9px}
.cal-event .em .s{color:var(--mist-deep)}
.cal-event .eq{font-size:10px;color:var(--wood);font-family:var(--serif);margin-bottom:12px;letter-spacing:2px}
.cal-event .sign{background:var(--tidal);color:#fff;border:none;padding:8px 20px;border-radius:20px;font-size:11px;letter-spacing:2px;font-family:var(--sans);cursor:pointer}
.cal-foot{margin-top:auto;padding:6px 0 4px;text-align:center;font-size:10px;color:var(--smoke);font-family:var(--serif);letter-spacing:1px;cursor:pointer}
</style>
</head>
