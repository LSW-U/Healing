<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>P18 课程详情与报名 · 共时海</title>
<link rel="stylesheet" href="common.css">
<style>
.p-course-detail{height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative}
.cd-scroll{flex:1;overflow-y:auto}
.cd-cover{height:180px;background:linear-gradient(150deg,#5B7B8A,#3F5E5A 60%,#2B3A42);position:relative;display:flex;align-items:flex-end;padding:0 22px 18px}
.cd-cover .back{position:absolute;top:14px;left:16px;color:#fff;font-size:18px;opacity:.9;cursor:pointer;text-decoration:none}
.cd-cover .more{position:absolute;top:14px;right:16px;color:#fff;font-size:18px;opacity:.9;cursor:pointer}
.cd-cover .symbol{font-family:var(--serif);font-size:44px;color:rgba(245,243,239,.9);letter-spacing:3px}
.cd-body{padding:20px 22px 90px}
.cd-title{font-family:var(--serif);font-size:21px;font-weight:500;letter-spacing:1px;color:var(--ink);line-height:1.4}
.cd-meta{display:flex;gap:14px;margin-top:12px;font-size:11px;color:var(--smoke);letter-spacing:1px}
.cd-meta span{display:flex;align-items:center;gap:4px}
.cd-price{margin-top:16px;display:flex;align-items:baseline;gap:8px}
.cd-price .p{font-family:var(--serif);font-size:24px;color:var(--tidal-deep);font-weight:500}
.cd-price .o{font-size:12px;color:var(--mist-deep);text-decoration:line-through}
.cd-sec{margin-top:22px}
.cd-sec .lab{font-family:var(--serif);font-size:12px;color:var(--smoke);letter-spacing:2px;margin-bottom:10px}
.cd-sec .txt{font-size:13px;color:var(--ink);line-height:1.8;letter-spacing:.5px}
.cd-suit{display:flex;flex-wrap:wrap;gap:8px}
.cd-suit span{font-size:10px;padding:4px 11px;border-radius:12px;letter-spacing:1px;background:rgba(201,181,154,.18);color:#8a7558}
.cd-outline{display:flex;flex-direction:column;gap:0}
.cd-ol-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--mist);font-size:12px}
.cd-ol-item:last-child{border-bottom:none}
.cd-ol-item .no{font-family:var(--serif);color:var(--wood);width:24px;flex-shrink:0}
.cd-ol-item .t{color:var(--ink);flex:1}
.cd-ol-item .d{color:var(--smoke);font-size:10px}
.cd-notice{margin-top:18px;padding:12px 14px;background:var(--mist);border-radius:8px;font-size:11px;color:var(--smoke);line-height:1.7}
.cd-actions{position:absolute;bottom:0;left:0;right:0;background:rgba(245,243,239,.96);border-top:1px solid var(--mist);padding:12px 22px;display:flex;align-items:center;gap:14px}
.cd-actions .ico-btn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;color:var(--smoke);cursor:pointer;min-width:36px}
.cd-actions .btn{flex:1;background:var(--tidal);color:#fff;border:none;padding:14px;border-radius:24px;font-size:13px;letter-spacing:2px;font-family:var(--sans);cursor:pointer;text-align:center;text-decoration:none}
</style>
</head>
<body>
<div class="phone"><div class="screen">
  <div class="p-course-detail">
    <div class="cd-scroll">
      <div class="cd-cover">
        <a href="p17-course-list.html" class="back">‹</a>
        <span class="more">⋯</span>
        <div class="symbol">冥</div>
      </div>
      <div class="cd-body">
        <div class="cd-title">冥想初阶 · 21 天入门</div>
        <div class="cd-meta"><span>林一沐</span><span>·</span><span>21 课时</span><span>·</span><span>录播</span></div>
        <div class="cd-price"><span class="p">¥ 199</span><span class="o">¥ 299</span></div>
        <div class="cd-sec">
          <div class="lab">课 程 介 绍</div>
          <div class="txt">21 天，每天 10-15 分钟，从呼吸开始建立冥想习惯。无需基础，跟随引导循序渐进。课程取材自共时海冥想课程体系，已陪伴数百位初学者。</div>
        </div>
        <div class="cd-sec">
          <div class="lab">适 合 人 群</div>
          <div class="cd-suit"><span>零基础</span><span>压力人群</span><span>睡眠困扰</span><span>想建立习惯</span></div>
        </div>
        <div class="cd-sec">
          <div class="lab">课 程 大 纲</div>
          <div class="cd-outline">
            <div class="cd-ol-item"><span class="no">一</span><span class="t">认识呼吸 · 安顿身体</span><span class="d">3 课时</span></div>
            <div class="cd-ol-item"><span class="no">二</span><span class="t">观察思绪 · 不评判</span><span class="d">5 课时</span></div>
            <div class="cd-ol-item"><span class="no">三</span><span class="t">情绪共处 · 温柔接纳</span><span class="d">6 课时</span></div>
            <div class="cd-ol-item"><span class="no">四</span><span class="t">日常正念 · 融入生活</span><span class="d">7 课时</span></div>
          </div>
        </div>
        <div class="cd-notice">报名后 365 天内有效，可反复观看。虚拟商品，开课后不支持退款。</div>
      </div>
    </div>
    <div class="cd-actions">
      <div class="ico-btn"><span>♡</span><span>收藏</span></div>
      <a class="btn" href="p14-signup-success.html">立 即 报 名</a>
    </div>
  </div>
</div></div>
</body>
</html>
