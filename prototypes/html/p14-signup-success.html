<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>P14 报名成功页 · 共时海</title>
<link rel="stylesheet" href="common.css">
<style>
.p-success{height:100%;display:flex;flex-direction:column;padding:0 24px;background:linear-gradient(180deg,#EFE9DF 0%,#F5F3EF 100%)}
.sc-icon{margin:40px auto 18px;width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#5B7B8A,#3F5E5A);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-size:30px;box-shadow:0 8px 20px rgba(91,123,138,.25)}
.sc-title{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:2px;color:var(--ink);text-align:center}
.sc-sub{font-family:var(--serif);font-size:12px;color:var(--smoke);text-align:center;margin-top:10px;letter-spacing:1px;line-height:1.7}
.sc-card{margin-top:24px;background:#fff;border-radius:14px;border:1px solid var(--mist);padding:6px 18px}
.sc-card .row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;font-size:12px}
.sc-card .row .l{color:var(--smoke);font-family:var(--serif);letter-spacing:1px}
.sc-card .row .r{color:var(--ink);font-weight:500;text-align:right}
.sc-card .row + .row{border-top:1px solid var(--mist)}
.sc-tip{margin-top:16px;font-size:11px;color:var(--smoke);font-family:var(--serif);text-align:center;line-height:1.7;letter-spacing:1px}
.sc-actions{margin-top:auto;padding:16px 0 20px;display:flex;flex-direction:column;gap:10px}
.sc-actions .primary{background:var(--tidal);color:#fff;border:none;padding:13px;border-radius:24px;font-size:13px;letter-spacing:2px;font-family:var(--sans);cursor:pointer;text-align:center}
.sc-actions .row-btns{display:flex;gap:10px}
.sc-actions .secondary{flex:1;background:#fff;border:1px solid var(--mist-deep);color:var(--ink);padding:12px;border-radius:24px;font-size:12px;letter-spacing:1px;font-family:var(--sans);cursor:pointer;text-align:center}
</style>
</head>
<body>
<div class="phone"><div class="screen">
  <div class="p-success">
    <a href="p06-me.html" style="position:absolute;top:16px;left:16px;color:var(--smoke);text-decoration:none;font-size:22px;z-index:5;">‹</a>
    <div class="sc-icon">海</div>
    <div class="sc-title">海 已 记 下</div>
    <div class="sc-sub">8月6日 · 颂钵音疗沙龙<br>期待与你在潮汐中相聚</div>
    <div class="sc-card">
      <div class="row"><span class="l">时 间</span><span class="r">8.6 周四 19:30</span></div>
      <div class="row"><span class="l">地 点</span><span class="r">共时海工作室</span></div>
      <div class="row"><span class="l">名 额</span><span class="r">已报 14 / 16</span></div>
      <div class="row"><span class="l">费 用</span><span class="r">¥ 128</span></div>
    </div>
    <div class="sc-tip">建议提前 10 分钟到场<br>着宽松衣物，勿饱食</div>
    <div class="sc-actions">
      <button class="primary">加 入 日 历 提 醒</button>
      <div class="row-btns">
        <button class="secondary">导 航 去 那 里</button>
        <button class="secondary"><a href="p24-orders.html">查 看 我 的 报 名</a></button>
      </div>
    </div>
  </div>
</div></div>
</body>
</html>
